name: Template Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        version: ">=0.13,<0.14"
    - name: Install just and actionlint
      run: |
        uv tool install rust-just
        uv tool install actionlint-py
    - name: Lint workflows
      run: |
        just actionlint
  render-and-check:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        version: ">=0.13,<0.14"
    # Tools the rendered project's ci-lint needs
    - name: Install just, actionlint, and yamllint
      run: |
        uv tool install rust-just==1.59.0
        uv tool install actionlint-py==1.7.12.25
        uv tool install yamllint==1.38.0
    - name: Render a project and run its checks
      run: |
        just check
    # Same action pin as the template's python.yml
    - name: Markdownlint
      uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      with:
        globs: _rendered/demo-project/**/*.md
